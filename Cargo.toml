[package]
name = "ccm"
version = "0.2.0"
edition = "2021"
description = "A fast local model manager for AI coding CLIs"
license = "MIT"
repository = "https://github.com/Thneoly/ccm"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
dirs = "6"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
toml = "0.8"
