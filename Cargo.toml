[package]
name = "ccm"
version = "0.1.0"
edition = "2021"
description = "A fast local model manager for AI coding CLIs"
license = "MIT"
repository = "https://github.com/Thneoly/ccm"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
