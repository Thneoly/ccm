[package]
name = "ccm"
version = "0.5.0"
edition = "2021"
description = "A fast local model manager for AI coding CLIs"
license = "MIT"
repository = "https://github.com/Thneoly/ccm"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
dirs = "6"
# futures-core is already in the dependency graph via axum/reqwest; the
# declaration only names the Stream trait for the SSE translation wrapper.
futures-core = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
toml = "0.8"
toml_edit = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# `vendored` compiles a bundled dbus so clean environments (CI runners, slim
# containers) build without libdbus-1-dev/pkg-config. Removing it makes the
# build probe the system dbus and fail where those packages are absent.
keyring = { version = "3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust", "vendored"] }
