current = "claude"

[providers.anthropic]
kind = "anthropic"
base_url = "https://api.anthropic.com"

[providers.zai]
kind = "anthropic-compatible"
base_url = "https://api.z.ai/api/anthropic"

[models.claude]
provider = "anthropic"
model_id = "claude-sonnet-4-5"

[models.glm]
provider = "zai"
model_id = "glm-5"

[profiles.coding]
model = "claude"

[profiles.fast]
model = "glm"

[routes.coding-route]
primary = "claude"
fallback = ["glm"]

[routes.coding-route.policy]
selection = "healthiest"
header_timeout_ms = 30000
fallback_on = [429, 502, 503, 504]
max_attempts = 3
backoff_ms = 200

[routes.coding-route.policy.circuit_breaker]
enabled = true
failure_threshold = 3
open_ms = 30000

[routes.fast-route]
primary = "glm"
fallback = []

[routes.fast-route.policy]
selection = "lowest-latency"
header_timeout_ms = 15000
fallback_on = [429, 502, 503, 504]
max_attempts = 1
backoff_ms = 0

[routes.fast-route.policy.circuit_breaker]
enabled = true
failure_threshold = 3
open_ms = 30000
