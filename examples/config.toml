[providers.anthropic]
kind = "anthropic"
base_url = "https://api.anthropic.com"
auth = "x-api-key"

[providers.zai]
kind = "anthropic-compatible"
base_url = "https://api.z.ai/api/anthropic"
auth = "x-api-key"

# openai-compatible providers speak the OpenAI chat/completions protocol
# upstream; CCM translates the Anthropic client protocol both ways. Omitting
# `auth` resolves to "bearer" for this kind (x-api-key for anthropic kinds).
[providers.deepseek]
kind = "openai-compatible"
base_url = "https://api.deepseek.com"

[models.claude]
provider = "anthropic"
model_id = "claude-sonnet-5-5"

[models.claude.routing]
cost_weight = 1.0
quality_weight = 1.0

[models.glm]
provider = "zai"
model_id = "glm-5.3"

[models.glm.routing]
cost_weight = 0.25
quality_weight = 0.85

# Optional per-MTok pricing table (v0.4): enables cost accounting for this
# model — usage records store a price snapshot, so later price edits never
# rewrite past records. A model without a [pricing] table is recorded as
# unpriced (cost_usd null, never guessed).
[models.glm.pricing]
input = 3.0
output = 15.0
cache_read = 0.3
cache_write = 3.75

[models.deepseek-chat]
provider = "deepseek"
model_id = "deepseek-chat"

[models.deepseek-chat.routing]
cost_weight = 0.1
quality_weight = 0.8

[profiles.coding]
model = "claude"

[profiles.fast]
model = "glm"

[routes.coding-route]
primary = "claude"
fallback = ["glm"]

[routes.coding-route.policy]
selection = "weighted"
header_timeout_ms = 30000
fallback_on = [429, 502, 503, 504]
max_attempts = 3
backoff_ms = 200

[routes.coding-route.policy.weights]
reliability = 0.4
latency = 0.2
cost = 0.2
quality = 0.2

[routes.coding-route.policy.circuit_breaker]
enabled = true
failure_threshold = 3
open_ms = 30000

[routes.fast-route]
primary = "glm"
fallback = []

[routes.fast-route.policy]
selection = "lowest-cost"
header_timeout_ms = 15000
fallback_on = [429, 502, 503, 504]
max_attempts = 1
backoff_ms = 0

[routes.fast-route.policy.circuit_breaker]
enabled = true
failure_threshold = 3
open_ms = 30000

# Mixed-protocol route: the openai-compatible primary is translated upstream;
# the anthropic fallback is passed through natively. Prompt caching and
# extended thinking are lost on the openai-compatible candidates (CCM warns
# once per route when validating).
[routes.budget-route]
primary = "deepseek-chat"
fallback = ["glm"]

[routes.budget-route.policy]
selection = "ordered"
header_timeout_ms = 30000
fallback_on = [429, 502, 503, 504]
max_attempts = 2
backoff_ms = 200

[routes.budget-route.policy.circuit_breaker]
enabled = true
failure_threshold = 3
open_ms = 30000

# Observability (v0.4): JSONL history under <CCM_HOME>/history/ plus the
# Prometheus /metrics exposition on the proxy's loopback-only listener.
# All defaults — the section may be omitted entirely.
[observability]
history_enabled = true
retention_days = 14
prometheus_enabled = true

# OTLP/HTTP JSON push (v0.5): POST the same 12 metric families to an OTLP
# collector every interval_secs. Section absent = push entirely off; it is
# independent of prometheus_enabled (OTLP-on + scrape-off keeps /metrics
# off). Auth headers, if ever needed, come from the OTEL_EXPORTER_OTLP_
# HEADERS env var ONLY — never this file.
# [observability.otlp]
# endpoint = "http://localhost:4318"
# interval_secs = 30

# Persistent client sessions (v0.5): scoped `ccm switch --client` targets
# are written to <CCM_HOME>/clients.toml so they survive proxy restarts.
# All defaults — persist = false restores v0.4 memory-only semantics.
[clients]
persist = true
ttl_days = 7
max_entries = 256
