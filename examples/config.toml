[providers.anthropic]
kind = "anthropic"
base_url = "https://api.anthropic.com"
auth = "x-api-key"

[providers.zai]
kind = "anthropic-compatible"
base_url = "https://api.z.ai/api/anthropic"
auth = "x-api-key"

[models.claude]
provider = "anthropic"
model_id = "claude-sonnet-5-5"

[models.claude.routing]
cost_weight = 1.0
quality_weight = 1.0

[models.glm]
provider = "zai"
model_id = "glm-5.3"

[models.glm.routing]
cost_weight = 0.25
quality_weight = 0.85

[profiles.coding]
model = "claude"

[profiles.fast]
model = "glm"

[routes.coding-route]
primary = "claude"
fallback = ["glm"]

[routes.coding-route.policy]
selection = "weighted"
header_timeout_ms = 30000
fallback_on = [429, 502, 503, 504]
max_attempts = 3
backoff_ms = 200

[routes.coding-route.policy.weights]
reliability = 0.4
latency = 0.2
cost = 0.2
quality = 0.2

[routes.coding-route.policy.circuit_breaker]
enabled = true
failure_threshold = 3
open_ms = 30000

[routes.fast-route]
primary = "glm"
fallback = []

[routes.fast-route.policy]
selection = "lowest-cost"
header_timeout_ms = 15000
fallback_on = [429, 502, 503, 504]
max_attempts = 1
backoff_ms = 0

[routes.fast-route.policy.circuit_breaker]
enabled = true
failure_threshold = 3
open_ms = 30000
